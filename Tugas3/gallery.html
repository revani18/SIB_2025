    <title>Gallery</title>
    <style>
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 15px;
        }
    
        .grid-item {
            text-align: center;
            text-decoration: none;
            color: #c2185b;
            font-size: 14px;
            font-weight: bold;
        }

        .grid-item img {
            width: 100%; 
            height: 130px; 
            object-fit: cover;   
            border: 1px solid #ff5db9;
            border-radius: 6px;
            margin-bottom: 8px;
            transition: transform 0.2s; 
        }

        .grid-item:hover img {
            transform: scale(1.05);
        }
    </style>
</head>
